<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>16:9 Laptop Screen Viewport</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #020617; /* गहरा बैकग्राउंड ताकि साइड का कटा हुआ हिस्सा ब्लैक दिखे */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* 💻 लैपटॉप का सटीक 16:9 एस्पेक्ट रेशियो बॉक्स */
        .laptop-container {
            position: relative;
            height: 100vh; /* स्क्रीन की पूरी ऊँचाई लेगा */
            aspect-ratio: 16 / 9; /* सटीक 16:9 लैपटॉप रेशियो (बाकी साइड्स अपने आप क्रॉप हो जाएँगे) */
            max-width: 100vw;
            background: #0f172a;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* Iframe जो अंदर के क्विज़ को 1366x768 के असली स्केल्ड व्यू में दिखाएगा */
        .laptop-iframe-wrapper {
            width: 1366px;
            height: 768px;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 🔴 ऊपर के URL बार को हटाने के लिए फुलस्क्रीन फ्लोटिंग बटन */
        .fullscreen-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 99999;
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.5);
            color: #38bdf8;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .fullscreen-btn:active {
            transform: scale(0.95);
        }

        /* 🔄 पोर्ट्रेट (सीधे फोन) के लिए रोटेट मैसेज */
        @media screen and (orientation: portrait) {
            .rotate-notice {
                display: flex !important;
            }
        }

        .rotate-notice {
            display: none;
            position: fixed;
            inset: 0;
            background: #090d16;
            z-index: 100000;
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .rotate-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <!-- 🔄 फोन सीधा होने पर चेतावनी -->
    <div class="rotate-notice">
        <div class="rotate-icon">🔄📱</div>
        <h2 style="font-size: 1.25rem; margin-bottom: 8px;">स्क्रीन को घुमाएँ (Rotate Phone)</h2>
        <p style="font-size: 0.85rem; color: #94a3b8; max-width: 300px; line-height: 1.5;">
            सटीक 16:9 लैपटॉप डिस्प्ले का मज़ा लेने के लिए Auto-Rotate चालू करके फ़ोन को आड़ा (Landscape) करें।
        </p>
    </div>

    <!-- 🔘 URL बार गायब करने के लिए बटन -->
    <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶ Fullscreen (Hide URL)</button>

    <!-- 💻 16:9 रेशियो लैपटॉप कंटेनर -->
    <div class="laptop-container" id="laptopBox">
        <div class="laptop-iframe-wrapper" id="iframeWrapper">
            <iframe id="laptopFrame" src="index.html"></iframe>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('iframeWrapper');
        const box = document.getElementById('laptopBox');

        // ऑटो-स्केलिंग: 1366x768 के व्यू को 16:9 वाले डिब्बे के अंदर परफेक्ट फिट करना
        function scaleIframe() {
            const containerWidth = box.clientWidth;
            const scale = containerWidth / 1366;
            wrapper.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', scaleIframe);
        window.addEventListener('load', scaleIframe);

        // URL से फाइल का पाथ पास करना
        const urlParams = new URLSearchParams(window.location.search);
        const targetFile = urlParams.get('file');
        const frame = document.getElementById('laptopFrame');

        if (targetFile) {
            frame.src = `quiz.html?file=${targetFile}`;
        }

        // ब्राउज़र के ऊपर से URL / Address Bar हटाने का फ़ंक्शन
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
