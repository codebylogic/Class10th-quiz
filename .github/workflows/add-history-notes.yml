name: add-history-notes
on:
  push:
    paths:
      - '.github/workflows/add-history-notes.yml'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download PDF into data/BSEB/10th
        run: |
          mkdir -p data/BSEB/10th
          curl -sL --retry 3 -o data/BSEB/10th/history_notes.pdf "https://drive.google.com/uc?export=download&id=1WjfqpZhr6G3Fk4RtCIIbhctyniKdY4w3&confirm=t"
          ls -la data/BSEB/10th/history_notes.pdf
          if head -c 4 data/BSEB/10th/history_notes.pdf | grep -q "%PDF"; then echo "VALID PDF"; else echo "NOT A PDF"; exit 1; fi
      - name: Commit and remove one-shot workflow
        run: |
          rm -f .github/workflows/add-history-notes.yml
          git config user.email "actions@users.noreply.github.com"
          git config user.name "auto-upload"
          git add -A
          git commit -m "docs: add BSEB Class 10 History notes PDF (data/BSEB/10th/history_notes.pdf)"
          git push
