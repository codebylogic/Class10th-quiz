name: update-credit
on:
  push:
    paths:
      - '.github/workflows/update-credit.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update creator credit
        run: |
          sed -i 's/SHIVAM KUMAR/SHIVAM AND LOKESH/g' index.html
          grep -n "Created By" index.html
      - name: Commit and remove one-shot workflow
        run: |
          rm -f .github/workflows/update-credit.yml
          git config user.email "actions@users.noreply.github.com"
          git config user.name "auto-update"
          git add -A
          git commit -m "update: creator credit -> SHIVAM AND LOKESH"
          git push
