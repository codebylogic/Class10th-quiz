name: repair-history-05
on:
  push:
    paths:
      - '.github/workflows/repair-history-05.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed JSON in History chapter 5
        run: |
          python3 - <<'PY'
          import json
          p = "data/BSEB/10th/SOCIAL_SCIENCE/HISTORY/05.json"
          lines = open(p, encoding="utf-8").read().split("\n")
          out = [l for l in lines if not (l.strip().startswith('"o":') and "Eli Whitney" in l and not l.strip().startswith('"o": ['))]
          open(p, "w", encoding="utf-8").write("\n".join(out))
          json.load(open(p, encoding="utf-8"))
          print("repaired OK")
          PY
      - name: Commit and remove one-shot workflow
        run: |
          rm -f .github/workflows/repair-history-05.yml
          git config user.email "actions@users.noreply.github.com"
          git config user.name "auto-repair"
          git add -A
          git commit -m "fix: repair History chapter 5 quiz JSON"
          git push
